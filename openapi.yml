    NeedRequestRecord:
      type: object
      required:
        - id
        - requester_id
        - requester_name
        - title
        - category
        - urgency
        - created_at
      properties:
        id:
          type: string
        requester_id:
          type: string
        requester_name:
          type: string
        title:
          type: string
        note:
          type: [string, "null"]
        category:
          $ref: "#/components/schemas/ItemCategoryEnum"
        urgency:
          $ref: "#/components/schemas/NeedUrgencyEnum"
        created_at:
          type: string
          format: date-time

    NeedMatchResult:
      type: object
      required:
        - listing
        - match_reason
      properties:
        listing:
          $ref: "#/components/schemas/ListingSummary"
        match_reason:
          type: string
