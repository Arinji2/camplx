    CreateEWasteSubmissionRequest:
      type: object
      required:
        - description
        - device_category
        - quantity
        - latitude
        - longitude
        - location_name
        - preferred_slot
      properties:
        description:
          type: string
          example: Dell Inspiron with dead motherboard & swollen battery
        device_category:
          $ref: "#/components/schemas/EWasteDeviceCategoryEnum"
        lifecycle_assessment:
          $ref: "#/components/schemas/LifecycleCategoryEnum"
          default: End-of-life
        quantity:
          type: integer
          minimum: 1
          example: 1
        latitude:
          type: number
          format: double
          example: 18.6251
        longitude:
          type: number
          format: double
          example: 73.8198
        location_name:
          type: string
          example: Tech Block B, DPU Campus
        preferred_slot:
          type: string
          example: Morning (10:00 AM - 1:00 PM)

    EWasteRequestRecord:
      type: object
      required:
        - id
        - student_id
        - description
        - device_category
        - lifecycle_assessment
        - quantity
        - location_name
        - status
        - estimated_carbon_kg
        - created_at
      properties:
        id:
          type: string
        student_id:
          type: string
        description:
          type: string
        device_category:
          $ref: "#/components/schemas/EWasteDeviceCategoryEnum"
        lifecycle_assessment:
          $ref: "#/components/schemas/LifecycleCategoryEnum"
        quantity:
          type: integer
        latitude:
          type: number
        longitude:
          type: number
        location_name:
          type: string
        preferred_slot:
          type: string
        status:
          $ref: "#/components/schemas/EWasteLifecycleStatusEnum"
        zone_cluster_id:
          type: [integer, "null"]
        pickup_sequence_order:
          type: [integer, "null"]
        estimated_carbon_kg:
          type: number
          example: 34.5
        created_at:
          type: string
          format: date-time

    UpdateEWasteStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/EWasteLifecycleStatusEnum"
        handler_notes:
          type: [string, "null"]
        certified_partner_id:
          type: [string, "null"]

    EWasteOptimizationPlanResponse:
      type: object
      required:
        - message
        - total_stops_optimized
        - routes_generated
      properties:
        message:
          type: string
          example: Clustering complete and routes sequenced.
        total_stops_optimized:
          type: integer
          example: 4
        routes_generated:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            description: Ordered sequence of request IDs.
          example:
            Zone 0: [ewaste-1, ewaste-2]
            Zone 1: [ewaste-3]

    SustainabilitySummaryResponse:
      type: object
      required:
        - personal_carbon_kg
        - campus_carbon_kg
        - items_reused_count
        - ewaste_diverted_kg
        - methodology_note
      properties:
        personal_carbon_kg:
          type: number
          example: 32.5
        campus_carbon_kg:
          type: number
          example: 1840.2
        items_reused_count:
          type: integer
          example: 142
        ewaste_diverted_kg:
          type: number
          example: 124.8
        methodology_note:
          type: string
          example: Directional CO2e savings based on standard embodied carbon displacement values.

    LeaderboardStandingItem:
      type: object
      required:
        - rank
        - user_id
        - display_name
        - points
        - carbon_saved_kg
      properties:
        rank:
          type: integer
          example: 1
        user_id:
          type: string
        display_name:
          type: string
          example: Aarav Sharma
        points:
          type: integer
          example: 420
        carbon_saved_kg:
          type: number
          example: 32.5

    NotificationItem:
      type: object
      required:
        - id
        - type
        - actor_name
        - message
        - read
        - created_at
      properties:
        id:
          type: string
        type:
          type: string
          enum: [like, reservation, request, message, system]
        actor_name:
          type: string
          example: Priya Nair
        message:
          type: string
          example: Priya Nair placed a pickup hold on your Casio Calculator.
        read:
          type: boolean
          example: false
        target_entity_type:
          type: [string, "null"]
          enum: [listing, reservation, need_request, chat]
        target_entity_id:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
